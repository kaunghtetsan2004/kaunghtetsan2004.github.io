  <script>
    function changeColor(color) {

      const carouselImages = document.getElementById("carouselImages");

      if (color === "black") {

        carouselImages.innerHTML = `
        <div class="carousel-item active">
            <img src="assets/ToeBag Black Font.png" class="d-block w-100">
        </div>

        <div class="carousel-item">
            <img src="assets/ToeBag Black Back.png" class="d-block w-100">
        </div>
       
        `;
      }

      if (color === "khaki") {

        carouselImages.innerHTML = `
        <div class="carousel-item active">
            <img src="assets/ToeBag Khaki Font.png" class="d-block w-100">
        </div>

        <div class="carousel-item">

        </div>
     
        `;
      }
    }
  </script>
