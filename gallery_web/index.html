<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <!-- css -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Header -->
   <header class="header">
    <h1 class="logo">Gallery</h1>
    <input type="search" id="search" class="search" placeholder="Search photos...">
   </header>

   <main class="container">
    <!-- category filter buttons -->
     <div class="filters" id="filters"></div>

     <!-- Photo grid -->
      <div class="gallery" id="gallery"></div>

      <p class="empty" id="empty" hidden>No photo found.</p>
   </main>

   <footer class="footer">
    <p>Place have every momery</p>
   </footer>

   <!-- lightbox -->
    <div class="lightbox" id="lightbox" hidden>
        <button class="lb-close" id="lbClose">&times;</button>
        <button class="lb-arrow lb-prev" id="lbPrev">&#8249;</button>
        <figure class="lb-content">
            <img id="lbImage" src="" alt="">
            <figcaption id="lbCaption"></figcaption>
        </figure>
        <button class="lb-arrow lb-next" id="lbNext">&#8250;</button>
    </div>
    

    
    <!-- js -->
     <script src="js/script.js"></script>
</body>
</html>
