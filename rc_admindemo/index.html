:root{
  --ink:#111111; --paper:#FFFFFF; --bg:#F6F6F4; --soft:#F3F3F1; --line:#E2E2DE; --line2:#EDEDEA; --muted:#5E5E5A; --muted2:#4A4A46; --hint:#8E8E89;
  --green:#1D6B3A; --greenBg:#E3F2E8; --amber:#8A5300; --amberBg:#FFF1D6; --amberBd:#F5B841; --red:#B0122A; --redBg:#FBE4E7; --blue:#1F4E99; --purple:#5B3FA0; --orange:#B4530A;
  --font:"HN","Helvetica Neue",Helvetica,Arial,sans-serif; --display:"HNX","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{border:1px solid #C9C9C4;background:#fff;padding:0 12px;height:40px;font-size:14px;border-radius:0}
textarea{padding:10px 12px;height:auto;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--ink);padding:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{margin:0}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:248px;flex-shrink:0;background:var(--ink);color:#fff;display:flex;flex-direction:column;gap:18px;padding:20px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.brand b{font-family:var(--display);font-weight:900;font-size:15px}
.tag{font-size:10px;font-weight:700;letter-spacing:.08em;border:1px solid #5E5E5A;color:#C9C9C4;padding:3px 6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--hint);padding:14px 10px 6px}
.nav a{height:40px;display:flex;align-items:center;gap:12px;padding:0 10px;color:#D6D6D1;font-weight:500}
.nav a:hover{background:#242422}
.nav a.on{background:#fff;color:var(--ink);font-weight:700}
.nav a .badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--ink)}
.nav a .badge.warn{background:var(--amberBd)}
.nav a.on .badge{background:var(--ink);color:#fff}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid #2A2A28}
.avatar{width:34px;height:34px;border-radius:17px;background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.avatar.dark{background:var(--ink);color:#fff}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;position:sticky;top:0;z-index:20}
.search{flex:1 1 260px;max-width:440px;height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--soft)}
.search input{border:0;background:transparent;height:38px;padding:0;flex:1;min-width:0}
.rolesw{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--ink)}
.seg button{height:36px;padding:0 14px;border:0;background:#fff;font-size:13px;font-weight:500}
.seg button.on{background:var(--ink);color:#fff}
.menu-btn{display:none;width:40px;height:40px;border:1px solid #C9C9C4;background:#fff;align-items:center;justify-content:center}
.content{padding:26px 28px 60px;display:flex;flex-direction:column;gap:18px;max-width:1440px;width:100%}
.demo-banner{background:#FFF3C4;color:#6B4E00;font-size:12px;font-weight:500;padding:8px 24px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.demo-banner button{background:none;border:0;text-decoration:underline;color:inherit;font-size:12px;padding:0}

/* common */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.crumb{font-size:13px;color:var(--muted)}
.crumb a{text-decoration:underline;text-underline-offset:3px}
.title{font-family:var(--display);font-weight:900;font-size:28px;line-height:1.1;text-transform:uppercase}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{height:40px;padding:0 16px;border:1px solid #C9C9C4;background:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.btn.primary:hover{background:#2a2a28}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.good{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.btn.sm{height:32px;padding:0 12px;font-size:12px}
.btn.lg{height:48px;font-size:14px}
.btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted2);cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line)}
.pad{padding:18px 20px}
.card h2{font-size:15px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.col2{flex:2 1 520px;min-width:0}
.col3{flex:3 1 600px;min-width:0}
.col1{flex:1 1 300px;min-width:0}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.kpi{padding:18px;display:flex;flex-direction:column;gap:8px}
.kpi .l{font-size:13px;color:var(--muted2);font-weight:500;display:flex;justify-content:space-between}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.01em}
.kpi .n{font-size:12px;font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:var(--muted);font-size:12px;font-weight:500;padding:10px 12px;background:#FAFAF8;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td,.tbl tr.sel td{background:#FAFAF6}
.tbl th:first-child,.tbl td:first-child{padding-left:18px}
.tbl th:last-child,.tbl td:last-child{padding-right:18px}
.scroll{overflow-x:auto}
.num{text-align:right;white-space:nowrap}
.strong{font-weight:700}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.link{text-decoration:underline;text-underline-offset:3px;font-weight:700}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;font-size:12px;font-weight:500;white-space:nowrap}
.pill .d{width:6px;height:6px;border-radius:3px;background:currentColor}
.st{display:inline-flex;padding:3px 8px;border:1px solid currentColor;font-size:12px;font-weight:500;white-space:nowrap}
.chdot{display:inline-block;width:8px;height:8px;margin-right:6px}
.thumb{background:var(--soft);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.thumb img{object-fit:contain;mix-blend-mode:multiply}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{height:44px;padding:0 14px;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tabs button.on{border-bottom-color:var(--ink);font-weight:700}
.tabs .c{font-size:12px;padding:1px 7px;background:#EFEFEC;color:var(--muted2)}
.tabs button.on .c{background:var(--ink);color:#fff}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.filters label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted2)}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500}
.field .h{font-weight:400;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.sw{width:44px;height:24px;border-radius:12px;border:0;padding:2px;background:#C9C9C4;display:inline-flex;justify-content:flex-start;flex-shrink:0;transition:background .15s}
.sw::after{content:"";width:20px;height:20px;border-radius:10px;background:#fff;display:block}
.sw.on{background:var(--ink);justify-content:flex-end}
.chip{height:36px;padding:0 14px;border:1px solid var(--ink);background:#fff;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff}
.chip:disabled{border-color:var(--line);color:#9C9C97;text-decoration:line-through;cursor:not-allowed;background:#fff}
.bar{height:4px;background:var(--line2);width:120px}
.bar span{display:block;height:4px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.box{background:var(--bg);padding:10px 12px;font-size:13px;line-height:1.5}
.empty{padding:40px 20px;text-align:center;color:var(--muted2)}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.hr{border-top:1px solid var(--line2)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.sample{background:#FFF3C4;color:#6B4E00;padding:1px 6px;font-size:11px;font-weight:700}

/* toasts / modal / drawer */
#toasts{position:fixed;right:20px;bottom:20px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:#fff;padding:12px 16px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:tin .25s ease-out;max-width:360px}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;animation:fin .15s}
@keyframes fin{from{opacity:0}to{opacity:1}}
.modal{background:#fff;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.proof{background:var(--soft);border:1px dashed var(--hint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted2);text-align:center;padding:16px}

/* chart */
.chart{height:220px;display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid #C9C9C4}
.chart .b{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:100%}
.chart .b span{font-size:11px;color:var(--muted2)}
.chart .b i{display:block;width:100%;max-width:44px;background:#BDBDB8}
.chart .b:last-child i{background:var(--ink)}
.chart-x{display:flex;gap:10px}
.chart-x span{flex:1 1 0;text-align:center;font-size:12px;color:var(--muted2)}

/* steps */
.steps{display:flex;list-style:none;margin:0;padding:0;flex:1 1 520px;min-width:0}
.steps li{flex:1 1 0;display:flex;flex-direction:column;gap:6px;min-width:0}
.steps .dot{width:26px;height:26px;border-radius:13px;border:2px solid #C9C9C4;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--hint);background:#fff;flex-shrink:0}
.steps li.done .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.steps li.cur .dot{border-color:var(--ink);color:var(--ink)}
.steps .ln{flex:1;height:2px;background:var(--line);margin:0 6px}
.steps li.done .ln{background:var(--ink)}
.steps .lb{font-size:13px;font-weight:500}
.steps li.cur .lb{font-weight:700}

/* stock grid */
.sg{border-collapse:collapse;font-size:13px}
.sg th{font-size:12px;color:var(--muted);font-weight:500;padding:4px 6px}
.sg td{padding:4px}
.lvl{display:inline-flex;min-width:42px;height:30px;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.lvl.ok{background:var(--greenBg);color:var(--green)}
.lvl.low{background:var(--amberBg);color:var(--amber)}
.lvl.out{background:var(--redBg);color:var(--red)}

/* mobile */
.mnav{display:none}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .25s}
  .app.open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
  .menu-btn{display:inline-flex}
  .top{padding:0 12px;gap:8px}
  .search{display:none}
  .rolesw .lbl{display:none}
  .content{padding:18px 14px 90px}
  .title{font-size:22px}
  .mnav{display:grid;position:fixed;left:0;right:0;bottom:0;height:64px;background:#fff;border-top:1px solid var(--line);z-index:50;grid-template-columns:repeat(4,1fr)}
  .mnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--muted)}
  .mnav a.on{color:var(--ink);font-weight:700}
  .mnav a.plus span{width:44px;height:30px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center}
  .tbl.cards thead{display:none}
  .tbl.cards tr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line2)}
  .tbl.cards td{border:0;padding:0!important}
  .tbl.cards td.hide-m{display:none}
  #toasts{left:12px;right:12px;bottom:76px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Admin menu"></aside>
  <div class="main">
    <!-- <div class="demo-banner"><span>Demo for client review · sample data · changes stay until you reload</span><button data-act="reset">Reset demo data</button></div> -->
    <header class="top">
      <button class="menu-btn" data-act="menu" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h18"/></svg></button>
      <label class="search"><span class="sr">Search</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E5E5A" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><input id="gsearch" placeholder="Search orders, products, customers…"></label>
      <div class="rolesw"><span class="lbl">View as</span><div class="seg" role="group" aria-label="View as role" id="rolesw"></div></div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
  <nav class="mnav" id="mnav" aria-label="Quick menu"></nav>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal"></div>

/* ----- New order ----- */
function draft() {
  if (!S.ui.draft) S.ui.draft = { channel: S.role === 'owner' ? 'Facebook' : 'Facebook', ref: '', lines: [], name: '', email: '', phone: '', addr: '', ful: 'deliver', zone: 0, pay: 'paid', method: 'KBZPay', disc: 0 };
  return S.ui.draft;
}
PAGES['new-order'] = () => {
  const d = draft(); const isOwner = can('dash');
  const zones = S.zones.filter((z) => z.on); const fee = d.ful === 'deliver' ? (zones[d.zone] || zones[0]).fee : 0;
  const sub = d.lines.reduce((a, l) => a + priceOf(prod(l.pid)) * l.qty, 0); const valid = d.lines.length && d.lines.every((l) => l.size) && d.name.trim();
  const chans = S.channels.filter((c) => c.on && c.name !== 'Website');
  return head(ownOnly() ? 'Sales' : '<a href="#orders">Orders</a> / New', 'New order', '<span class="note">For sales from Facebook, Instagram, other websites or walk-in</span>') +
  `<div class="row"><div class="col3" style="display:flex;flex-direction:column;gap:16px">
    <section class="card pad" style="display:flex;flex-direction:column;gap:14px"><h2>1 · Where was it sold?</h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap" role="radiogroup" aria-label="Sales channel">${chans.map((c) => `<button class="chip ${d.channel === c.name ? 'on' : ''}" role="radio" aria-checked="${d.channel === c.name}" data-act="dch" data-v="${c.name}"><span style="width:8px;height:8px;background:${c.color}"></span>${c.name}</button>`).join('')}</div>
      <label class="field">Reference <span class="h">(chat link, partner order no. — optional)</span><input data-in="d.ref" value="${esc(d.ref)}" placeholder="e.g. m.me/… or PW-55821"></label></section>
    <section class="card pad" style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between"><h2>2 · Products</h2><span class="note">Tap a product to add it</span></div>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px">${S.products.filter((p) => p.active).map((p) => { const t = stockTotal(p); return `<button data-act="dadd" data-v="${p.id}" ${t ? '' : 'disabled'} style="border:1px solid var(--line);background:#fff;padding:8px;display:flex;flex-direction:column;gap:6px;text-align:left;opacity:${t ? 1 : .5}">${thumb(imgOf(p), 100).replace('width:100px', 'width:100%')}<span style="font-size:12px;font-weight:500">${p.name}</span><span class="sub" style="margin:0">${t ? money(priceOf(p)) + ' · ' + t + ' left' : 'Sold out'}</span></button>`; }).join('')}</div>
      ${d.lines.length ? d.lines.map((l, i) => { const p = prod(l.pid); const left = l.size ? p.stock[l.color + '|' + l.size] : 0; return `<div class="list-row" style="flex-wrap:wrap">${thumb(imgOf(p, l.color), 56)}<div style="flex:1 1 150px;display:flex;flex-direction:column;gap:2px"><b>${p.name}</b><span style="font-size:12px;font-weight:500;color:${!l.size ? 'var(--red)' : left <= 2 ? 'var(--amber)' : 'var(--green)'}">${l.size ? left + ' in stock (' + l.color + ' ' + l.size + ')' : 'Pick an available size'}</span></div>
        <label class="field" style="font-size:11px;color:var(--muted)">Color<select data-in="dcolor" data-i="${i}" style="height:36px">${p.colors.map((c) => `<option ${c.n === l.color ? 'selected' : ''}>${c.n}</option>`).join('')}</select></label>
        <div class="field" style="font-size:11px;color:var(--muted)">Size<div style="display:flex;gap:4px">${p.sizes.map((s) => { const n = p.stock[l.color + '|' + s] || 0; return `<button class="chip ${l.size === s ? 'on' : ''}" style="min-width:40px;padding:0 8px" data-act="dsize" data-i="${i}" data-v="${s}" ${n ? '' : 'disabled'}>${s}</button>`; }).join('')}</div></div>
        <div class="field" style="font-size:11px;color:var(--muted)">Qty<div style="display:flex;align-items:center;border:1px solid #C9C9C4;height:36px"><button data-act="dqty" data-i="${i}" data-v="-1" aria-label="Less" style="width:32px;height:34px;border:0;background:#FAFAF8">−</button><b style="width:26px;text-align:center;color:#111">${l.qty}</b><button data-act="dqty" data-i="${i}" data-v="1" aria-label="More" style="width:32px;height:34px;border:0;background:#FAFAF8">+</button></div></div>
        <b style="width:110px;text-align:right">${money(priceOf(p) * l.qty)}</b><button data-act="ddel" data-i="${i}" aria-label="Remove" style="width:36px;height:36px;border:0;background:none">${ico('x', 16, 2)}</button></div>`; }).join('') : '<div class="empty" style="border:1px dashed #C9C9C4;padding:22px">No products yet. Tap a product above to add it.</div>'}</section>
    <section class="card pad" style="display:flex;flex-direction:column;gap:14px"><h2>3 · Customer &amp; delivery</h2>
      <div class="fgrid"><label class="field">Customer name *<input data-in="d.name" value="${esc(d.name)}" placeholder="e.g. Min Khant"></label><label class="field">Email <span class="h">(optional, for receipt)</span><input type="email" data-in="d.email" value="${esc(d.email)}"></label></div>
      ${seg([['pickup', 'Picked up / handed over'], ['deliver', 'We deliver'], ['partner', 'Partner ships it']], d.ful, 'dful', 'aria-label="How they get it" style="align-self:flex-start;flex-wrap:wrap"')}
      ${d.ful === 'deliver' ? `<div class="fgrid"><label class="field">Receiver phone<input type="tel" data-in="d.phone" value="${esc(d.phone)}" placeholder="09…"></label><label class="field">Delivery zone<select data-in="dzone">${zones.map((z, i) => `<option value="${i}" ${d.zone == i ? 'selected' : ''}>${z.city} · ${z.town} · ${num(z.fee)} MMK</option>`).join('')}</select></label><label class="field" style="grid-column:1/-1">Address<input data-in="d.addr" value="${esc(d.addr)}" placeholder="No., street, ward, township"></label></div>` : ''}</section>
  </div>
  <aside class="col1" style="display:flex;flex-direction:column;gap:16px;position:sticky;top:84px">
    <section class="card pad" style="display:flex;flex-direction:column;gap:10px;font-size:14px"><h2>Summary</h2>
      <div style="display:flex;justify-content:space-between"><span class="note" style="font-size:14px">Channel</span><span>${chLabel(d.channel)}</span></div>
      <div style="display:flex;justify-content:space-between"><span class="note" style="font-size:14px">Subtotal (${d.lines.reduce((a, l) => a + l.qty, 0)} items)</span><span>${money(sub)}</span></div>
      <div style="display:flex;justify-content:space-between"><span class="note" style="font-size:14px">Delivery</span><span>${fee ? money(fee) : '—'}</span></div>
      ${isOwner ? `<div style="display:flex;justify-content:space-between;align-items:center"><label for="disc" class="note" style="font-size:14px">Discount</label><input id="disc" data-in="d.disc" value="${d.disc || ''}" placeholder="0" style="width:110px;height:34px;text-align:right"></div>` : ''}
      <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;border-top:1px solid #111;padding-top:10px"><span>Total</span><span>${money(sub + fee - (isOwner ? +d.disc || 0 : 0))}</span></div></section>
    <section class="card pad" style="display:flex;flex-direction:column;gap:12px"><h2>Payment</h2>${seg([['paid', 'Paid'], ['cod', 'Unpaid / COD'], ['deposit', 'Deposit']], d.pay, 'dpay', 'aria-label="Payment status" style="display:grid;grid-template-columns:repeat(3,1fr)"')}
      <label class="field">Method<select data-in="d.method">${['KBZPay', 'WavePay', 'AYA Pay', 'Cash', 'Bank transfer', 'Paid to partner website'].map((m) => `<option ${d.method === m ? 'selected' : ''}>${m}</option>`).join('')}</select></label></section>
    <button class="btn primary lg" style="height:54px;font-size:15px" data-act="create" ${valid ? '' : 'disabled'}>CREATE ORDER</button>
    <span class="note">${valid ? 'Stock is reduced as soon as the order is created.' : 'Add at least one product with a size and the customer name.'}${isOwner ? '' : ' Prices are set by the shop and can\'t be changed here.'}</span>
  </aside></div>`;
};

/* ----- Payments ----- */
PAGES.payments = () => {
  const T = [['verify', 'To verify'], ['paid', 'Verified'], ['rejected', 'Rejected']];
  const list = S.orders.filter((o) => o.pay === S.ui.ptab && (S.ui.ptab !== 'paid' || ['KBZPay', 'WavePay', 'AYA Pay'].includes(o.method))).sort((a, b) => a.date - b.date);
  const sumBy = (m) => S.orders.filter((o) => o.method === m && ['verify', 'paid'].includes(o.pay) && o.date >= NOW - 21 * HOUR);
  return head('Sales', 'Payments', '<span class="note">Check customer transfer screenshots before packing</span>') +
  `<div class="grid kpis">${[['Waiting to verify', S.orders.filter((o) => o.pay === 'verify').length, 'Oldest first below'], ...['KBZPay', 'WavePay', 'AYA Pay'].map((m) => [m + ' today', money(sumBy(m).reduce((a, o) => a + orderTotal(o), 0)), sumBy(m).length + ' transfers'])].map(([l, v, n]) => `<div class="card kpi"><span class="l">${l}</span><span class="v" style="font-size:22px">${v}</span><span class="n" style="color:var(--muted)">${n}</span></div>`).join('')}</div>` +
  tabs(T.map(([id, l]) => [id, l, S.orders.filter((o) => o.pay === id).length]), S.ui.ptab, 'ptab') +
  (list.length ? `<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">${list.map((o) => { const m = Math.round((NOW - o.date) / MIN); return `<article class="card" style="display:flex;gap:14px;padding:14px"><div class="proof" style="width:92px;height:150px;font-size:10px;padding:6px;flex-shrink:0">${ico('img', 22, 1.5)}Screenshot</div>
    <div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><a href="#order-${o.no}" class="link">${o.no.slice(-4)}</a>${o.pay === 'verify' ? `<span style="font-size:12px;font-weight:700;color:${m >= 90 ? 'var(--red)' : m >= 60 ? 'var(--amber)' : 'var(--muted2)'}">Waiting ${ago(o.date)}</span>` : ''}</div>
    <span>${esc(o.cust.name)}</span><span class="note" style="font-size:13px">${o.method} transfer</span><span style="font-size:18px;font-weight:700">${money(orderTotal(o))}</span>${payPill(o)}
    <a href="#order-${o.no}" class="btn primary sm" style="margin-top:auto">${o.pay === 'verify' ? 'Review screenshot' : 'Open order'}</a></div></article>`; }).join('')}</div>` : '<div class="card empty">Nothing here — all payments are checked.</div>');
};

/* ----- Customers ----- */
function customers() {
  const map = {};
  [...S.orders].sort((a, b) => a.date - b.date).forEach((o) => { const k = o.cust.name; if (!map[k]) map[k] = { name: k, email: o.cust.email, addr: o.cust.addr, orders: [], src: o.channel }; map[k].orders.push(o); });
  return Object.values(map).map((c) => ({ ...c, spent: c.orders.filter((o) => o.status !== 'Cancelled').reduce((a, o) => a + orderTotal(o), 0), last: Math.max(...c.orders.map((o) => o.date)) })).sort((a, b) => b.last - a.last);
}
PAGES.customers = () => {
  const C = customers(); const sel = C[Math.min(S.ui.cust, C.length - 1)];
  const sizes = {}; sel.orders.forEach((o) => o.items.forEach((i) => { sizes[i.size] = (sizes[i.size] || 0) + 1; }));
  return head('Sales', 'Customers', me().role === 'Owner' ? `<button class="btn" data-act="toast" data-v="Customer list exported (demo)">Export</button>` : '') +
  `<div class="row"><section class="card col3"><div class="scroll"><table class="tbl"><thead><tr><th>Customer</th><th>Account</th><th>Orders</th><th class="num">Spent</th><th>Last order</th><th>First came from</th></tr></thead><tbody>
    ${C.map((c, i) => `<tr class="click ${i === S.ui.cust ? 'sel' : ''}" data-act="cust" data-v="${i}"><td><span style="display:flex;align-items:center;gap:10px"><span class="avatar dark">${ini(c.name)}</span><span><b>${esc(c.name)}</b><div class="sub">${esc(c.email || '—')}</div></span></span></td><td style="color:${c.email ? 'var(--green)' : 'var(--muted2)'};font-size:12px;font-weight:500">${c.email ? 'Registered' : 'No account'}</td><td>${c.orders.length}</td><td class="num strong">${money(c.spent)}</td><td>${when(c.last)}</td><td>${chLabel(c.src)}</td></tr>`).join('')}
  </tbody></table></div></section>
  <aside class="card pad col1" style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;gap:12px;align-items:center"><span class="avatar dark" style="width:48px;height:48px;border-radius:24px">${ini(sel.name)}</span><span><b style="font-size:17px">${esc(sel.name)}</b><div class="sub">${esc(sel.email || 'No email')}</div></span></div>
    <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px"><div class="box"><span class="sub" style="margin:0">Orders</span><div style="font-size:20px;font-weight:700">${sel.orders.length}</div></div><div class="box"><span class="sub" style="margin:0">Spent</span><div style="font-size:20px;font-weight:700">${num(sel.spent)}</div></div></div>
    <div><b style="font-size:13px">Address</b><div class="note" style="font-size:13px">${esc(sel.addr)}</div></div><div><b style="font-size:13px">Usual sizes</b><div class="note" style="font-size:13px">${Object.keys(sizes).join(', ')}</div></div>
    <div><b style="font-size:13px">Orders</b>${sel.orders.map((o) => `<a href="#order-${o.no}" class="list-row" style="justify-content:space-between;padding:8px 0;font-size:13px"><span class="link" style="font-weight:500">${o.no}</span><span>${money(orderTotal(o))}</span></a>`).join('')}</div>
    ${can('neworder', 'c') ? `<button class="btn primary" data-act="custorder" data-v="${S.ui.cust}">Create order for this customer</button>` : ''}</aside></div>`;
};

/* ----- Products ----- */
PAGES.products = () => {
  const T = [['all', 'All'], ['on', 'On store'], ['off', 'Hidden'], ['low', 'Low stock']];
  const isLow = (p) => Object.values(p.stock).some((v) => v > 0 && v <= 2) || stockTotal(p) === 0;
  const list = S.products.filter((p) => S.ui.prtab === 'all' || (S.ui.prtab === 'on' && p.active) || (S.ui.prtab === 'off' && !p.active) || (S.ui.prtab === 'low' && isLow(p)));
  const edit = can('products', 'e');
  return head('Catalog · <span class="sample">SAMPLE DATA</span>', 'Products', can('products', 'c') ? `<button class="btn primary" data-act="newprod">${ico('plus', 16, 2.2)}Add product</button>` : '') +
  tabs(T.map(([id, l]) => [id, l, S.products.filter((p) => id === 'all' || (id === 'on' && p.active) || (id === 'off' && !p.active) || (id === 'low' && isLow(p))).length]), S.ui.prtab, 'prtab') +
  `<section class="card"><div class="scroll"><table class="tbl"><thead><tr><th>Product</th><th>Category</th><th class="num">Price</th><th>Stock</th><th>Variants</th><th>Featured</th><th>On store</th><th></th></tr></thead><tbody>
  ${list.map((p) => { const t = stockTotal(p); const fg = t === 0 ? 'var(--red)' : isLow(p) ? 'var(--amber)' : 'var(--green)'; return `<tr><td><a href="#product-${p.id}" style="display:flex;align-items:center;gap:12px">${thumb(imgOf(p), 52)}<span><b>${p.name}</b><div class="sub">${p.active ? 'Visible on store' : 'Hidden (draft)'}</div></span></a></td><td>${p.cat}</td>
    <td class="num"><span style="font-weight:500;color:${p.sale ? 'var(--red)' : 'inherit'}">${money(priceOf(p))}</span>${p.sale ? `<div class="sub" style="text-decoration:line-through">${money(p.price)}</div>` : ''}</td>
    <td><div style="display:flex;flex-direction:column;gap:5px"><span style="font-weight:500;color:${fg}">${t === 0 ? 'Sold out' : t + ' in stock'}</span><span class="bar"><span style="width:${Math.min(120, t * 3)}px;background:${fg}"></span></span></div></td>
    <td><span style="display:flex;gap:4px;align-items:center">${p.colors.map((c) => `<span style="width:14px;height:14px;border-radius:7px;background:${c.hex};box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)"></span>`).join('')}<span class="sub" style="margin:0 0 0 4px">${p.colors.length * p.sizes.length}</span></span></td>
    <td><button data-act="feat" data-v="${p.id}" ${edit ? '' : 'disabled'} aria-pressed="${p.featured}" aria-label="Feature ${p.name}" style="background:none;border:0;width:36px;height:36px">${star(p.featured)}</button></td>
    <td>${edit ? sw(p.active, 'pactive', `data-v="${p.id}"`, 'Show ' + p.name) : (p.active ? 'Yes' : 'No')}</td><td class="num"><a href="#product-${p.id}" class="btn sm">${edit ? 'Edit' : 'View'}</a></td></tr>`; }).join('')}
  </tbody></table></div></section>`;
};

/* ----- Product editor ----- */
PAGES.product = (id) => {
  const p = prod(id); if (!p) return noAccess('this product');
  const edit = can('products', 'e'); const dis = edit ? '' : 'disabled';
  const ALL = ['S', 'M', 'L', 'XL', 'XXL'];
  return head('<a href="#products">Products</a> / ' + esc(p.name), esc(p.name), edit ? `<a href="#products" class="btn">Back</a><button class="btn primary" data-act="saveprod" data-v="${p.id}">Save</button>` : '<span class="note">View only</span>') +
  `<div class="row"><div class="col3" style="display:flex;flex-direction:column;gap:16px">
    <section class="card pad" style="display:flex;flex-direction:column;gap:14px"><h2>Basic info</h2>
      <label class="field">Title<input data-in="p.name" data-v="${p.id}" value="${esc(p.name)}" ${dis}></label>
      <label class="field">Short description <span class="h">(shown under the price)</span><input data-in="p.short" data-v="${p.id}" value="${esc(p.short)}" ${dis}></label>
      <div class="fgrid"><label class="field">Details<textarea rows="4" data-in="p.details" data-v="${p.id}" ${dis}>${esc(p.details)}</textarea></label><label class="field">Material &amp; care<textarea rows="4" data-in="p.care" data-v="${p.id}" placeholder="e.g. Wash cold" ${dis}>${esc(p.care)}</textarea></label></div></section>
    <section class="card pad" style="display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between"><h2>Photos by color</h2><span class="note">First photo is the main one</span></div>
      ${p.colors.map((c, ci) => `<div class="list-row" style="flex-wrap:wrap"><span style="width:100px;display:flex;align-items:center;gap:8px;font-weight:500"><span style="width:14px;height:14px;border-radius:7px;background:${c.hex};box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)"></span>${esc(c.n)}</span>
        <span style="position:relative">${thumb(c.upload || IMG[c.img], 76)}<span style="position:absolute;left:0;bottom:0;background:#111;color:#fff;font-size:9px;font-weight:700;padding:2px 4px">MAIN</span></span>
        ${edit ? `<label style="width:76px;height:76px;border:1px dashed #8E8E89;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--muted2);cursor:pointer">${ico('plus', 18, 2)}Upload<input type="file" accept="image/*" class="sr" data-in="photo" data-v="${p.id}" data-i="${ci}"></label>` : ''}</div>`).join('')}</section>
    <section class="card pad" style="display:flex;flex-direction:column;gap:14px"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px"><h2>Variants &amp; stock</h2><span class="note">${p.colors.length * p.sizes.length} variants · <b style="color:#111">${stockTotal(p)} in stock</b></span></div>
      <div style="display:flex;gap:18px;flex-wrap:wrap"><div class="field">Colors<div style="display:flex;gap:6px;flex-wrap:wrap">${p.colors.map((c) => `<span class="chip"><span style="width:12px;height:12px;border-radius:6px;background:${c.hex};box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)"></span>${esc(c.n)}</span>`).join('')}${edit ? `<button class="chip" style="border-style:dashed" data-act="addcolor" data-v="${p.id}">+ Add color</button>` : ''}</div></div>
        <div class="field">Sizes <span class="h">(click to turn on/off)</span><div style="display:flex;gap:6px">${ALL.map((s) => `<button class="chip ${p.sizes.includes(s) ? 'on' : ''}" data-act="tsize" data-v="${p.id}" data-i="${s}" ${dis} aria-pressed="${p.sizes.includes(s)}">${s}</button>`).join('')}</div></div></div>
      <div class="scroll" style="border:1px solid var(--line2)"><table class="tbl"><thead><tr><th>Color</th><th>Size</th><th>SKU</th><th>Stock</th><th>Status</th></tr></thead><tbody>
      ${p.colors.map((c) => p.sizes.map((s, j) => { const k = c.n + '|' + s; const n = p.stock[k] || 0; return `<tr><td>${j === 0 ? `<b>${esc(c.n)}</b>` : ''}</td><td>${s}</td><td class="mono" style="color:var(--muted2)">RC-${p.id.toUpperCase()}-${c.n.slice(0, 3).toUpperCase()}-${s}</td>
        <td><div style="display:flex;align-items:center;border:1px solid #C9C9C4;width:112px;height:34px"><button data-act="pstock" data-v="${p.id}" data-i="${k}" data-d="-1" ${dis} aria-label="Less" style="width:32px;height:32px;border:0;background:#FAFAF8">−</button><b style="flex:1;text-align:center">${n}</b><button data-act="pstock" data-v="${p.id}" data-i="${k}" data-d="1" ${dis} aria-label="More" style="width:32px;height:32px;border:0;background:#FAFAF8">+</button></div></td>
        <td style="font-size:12px;font-weight:700;color:${n === 0 ? 'var(--red)' : n <= 2 ? 'var(--amber)' : 'var(--green)'}">${n === 0 ? 'SOLD OUT' : n <= 2 ? 'LOW' : 'IN STOCK'}</td></tr>`; }).join('')).join('')}</tbody></table></div></section>
  </div>
  <aside class="col1" style="display:flex;flex-direction:column;gap:16px">
    <section class="card pad" style="display:flex;flex-direction:column;gap:12px"><h2>Visibility</h2>
      ${[[true, 'On store', 'Customers can see and buy it'], [false, 'Hidden (draft)', 'Only staff can see it']].map(([v, l, h]) => `<label style="display:flex;gap:10px;padding:10px 12px;border:${p.active === v ? '2px solid #111' : '1px solid var(--line)'};cursor:pointer"><input type="radio" name="vis" data-act="pvis" data-v="${p.id}" data-i="${v}" ${p.active === v ? 'checked' : ''} ${dis}><span><b style="font-weight:500">${l}</b><div class="sub">${h}</div></span></label>`).join('')}
      <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line2);padding-top:10px"><span><b style="font-weight:500">Featured on home</b><div class="sub">Shows in "Now Featuring"</div></span>${edit ? sw(p.featured, 'feat', `data-v="${p.id}"`, 'Featured') : ''}</div></section>
    <section class="card pad" style="display:flex;flex-direction:column;gap:12px"><h2>Pricing</h2><label class="field">Price (MMK)<input data-in="p.price" data-v="${p.id}" value="${num(p.price)}" ${dis}></label>
      <label style="display:flex;gap:8px;align-items:center;font-size:13px"><input type="checkbox" data-act="psale" data-v="${p.id}" ${p.sale ? 'checked' : ''} ${dis}>Put on sale</label>
      ${p.sale ? `<label class="field">Sale price (MMK)<input data-in="p.sale" data-v="${p.id}" value="${num(p.sale)}" ${dis}></label><span class="note">Shows a SALE badge and the old price crossed out.</span>` : ''}</section>
    <section class="card pad" style="display:flex;flex-direction:column;gap:12px"><h2>Organize</h2><label class="field">Category<select data-in="p.cat" data-v="${p.id}" ${dis}>${S.categories.map((c) => `<option ${p.cat === c.name ? 'selected' : ''}>${c.name}</option>`).join('')}</select></label>
      <div class="field">Collections<div style="display:flex;gap:6px;flex-wrap:wrap">${S.collections.map((c) => `<button class="chip ${p.collections.includes(c.name) ? 'on' : ''}" style="height:30px;font-size:12px" data-act="pcol" data-v="${p.id}" data-i="${esc(c.name)}" ${dis}>${esc(c.name)}</button>`).join('')}</div></div></section>
    <section class="card pad" style="display:flex;flex-direction:column;gap:6px"><h2 style="margin-bottom:4px">Search preview</h2><span style="font-size:15px;color:var(--blue)">${esc(p.name)} — Rangoon Club</span><span style="font-size:12px;color:var(--green)">rangoonclub.com/products/${p.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}</span><span class="note" style="font-size:13px">${esc(p.short || p.details || 'Add a short description.')} ${money(priceOf(p))}.</span></section>
  </aside></div>`;
};

/* ----- Inventory ----- */
PAGES.inventory = () => {
  if (!can('inventory', 'e')) return stockView();
  const rows = []; S.products.forEach((p) => p.colors.forEach((c) => p.sizes.forEach((s) => rows.push({ p, c, s, k: p.id + '|' + c.n + '|' + s, n: p.stock[c.n + '|' + s] || 0 }))));
  const f = S.ui.inv; const list = rows.filter((r) => f === 'all' || (f === 'low' && r.n > 0 && r.n <= 2) || (f === 'out' && r.n === 0));
  const sel = rows.find((r) => r.k === S.ui.invSel) || rows[0]; const T = S.ui.invType; const q = S.ui.invQty;
  const after = T === 'set' ? q : sel.n + q;
  return head('Catalog', 'Inventory', `<button class="btn" data-act="toast" data-v="Stock list exported (demo)">Export stock list</button>`) +
  `<div class="row"><section class="card col3"><div class="pad" style="padding-bottom:12px">${seg([['all', 'All variants (' + rows.length + ')'], ['low', 'Low 1–2 (' + rows.filter((r) => r.n > 0 && r.n <= 2).length + ')'], ['out', 'Sold out (' + rows.filter((r) => r.n === 0).length + ')']], f, 'inv', 'aria-label="Filter"')}</div>
    <div class="scroll" style="max-height:640px;overflow-y:auto"><table class="tbl"><thead><tr><th>Product</th><th>Variant</th><th>SKU</th><th>In stock</th><th></th></tr></thead><tbody>
    ${list.map((r) => `<tr class="${r.k === sel.k ? 'sel' : ''}"><td><span style="display:flex;align-items:center;gap:10px">${thumb(IMG[r.c.img], 36)}<b style="font-weight:500">${r.p.name}</b></span></td><td>${esc(r.c.n)} / ${r.s}</td><td class="mono" style="color:var(--muted2)">RC-${r.p.id.toUpperCase()}-${r.c.n.slice(0, 3).toUpperCase()}-${r.s}</td><td>${lvl(r.n)}</td><td class="num"><button class="btn sm" data-act="invsel" data-v="${r.k}">Adjust</button></td></tr>`).join('')}
    </tbody></table></div></section>
  <aside class="col1" style="display:flex;flex-direction:column;gap:16px"><section class="card pad" style="border:2px solid #111;display:flex;flex-direction:column;gap:12px"><h2>Adjust stock</h2>
      <span><b>${sel.p.name}</b><div class="sub">${esc(sel.c.n)} / ${sel.s} · now ${sel.n} in stock</div></span>
      ${seg([['restock', 'Restock'], ['return', 'Return'], ['set', 'Set count']], T, 'invtype', 'style="display:grid;grid-template-columns:repeat(3,1fr)"')}
      <div style="display:flex;align-items:center;gap:10px"><span style="flex:1;font-size:13px;font-weight:500">${T === 'set' ? 'Set to' : 'Add'}</span><div style="display:flex;align-items:center;border:1px solid #C9C9C4;height:40px"><button data-act="invqty" data-v="-1" aria-label="Less" style="width:36px;height:38px;border:0;background:#FAFAF8">−</button><b style="width:40px;text-align:center">${q}</b><button data-act="invqty" data-v="1" aria-label="More" style="width:36px;height:38px;border:0;background:#FAFAF8">+</button></div></div>
      <label class="field">Reason / note<input id="inv-note" placeholder="e.g. New batch from factory"></label>
      <div class="box">After saving: <b>${after} in stock</b></div><button class="btn primary lg" data-act="invsave">Save adjustment</button></section>
    <section class="card pad"><h2 style="margin-bottom:6px">Recent stock changes</h2>${S.moves.slice(0, 7).map((m) => `<div class="list-row" style="justify-content:space-between;padding:8px 0;font-size:13px"><span><b style="font-weight:500">${esc(m.what)}</b><div class="sub">${esc(m.why)} · ${esc(m.who)} · ${when(m.t)}</div></span><b style="color:${m.d >= 0 ? 'var(--green)' : 'var(--red)'}">${m.d >= 0 ? '+' : '−'}${Math.abs(m.d)}</b></div>`).join('')}</section></aside></div>`;
};
function stockView() {
  const q = (S.ui.sq || '').toLowerCase();
  return head('View only — stock is updated by managers', 'Stock', `<span class="note" style="display:flex;gap:6px;align-items:center">${ico('lock', 14, 2)}Read-only</span>`) +
  `<label style="background:#fff;border:1px solid #C9C9C4;max-width:520px;height:48px;display:flex;align-items:center;padding:0 12px"><span class="sr">Search</span><input style="border:0;flex:1;height:44px;padding:0" data-in="sq" value="${esc(S.ui.sq || '')}" placeholder="Type a product name, e.g. striped" style="font-size:16px"></label>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(380px,1fr))">${S.products.filter((p) => p.active && (!q || p.name.toLowerCase().includes(q))).map((p) => `<article class="card" style="padding:16px;display:flex;gap:16px">${thumb(imgOf(p), 96)}
    <div style="flex:1;display:flex;flex-direction:column;gap:8px;min-width:0"><div style="display:flex;justify-content:space-between;gap:8px"><b>${p.name}</b><b>${money(priceOf(p))}</b></div>
    <table class="sg"><thead><tr><th style="text-align:left">Color</th>${p.sizes.map((s) => `<th>${s}</th>`).join('')}</tr></thead><tbody>${p.colors.map((c) => `<tr style="border-top:1px solid var(--line2)"><td style="font-weight:500">${esc(c.n)}</td>${p.sizes.map((s) => `<td>${lvl(p.stock[c.n + '|' + s] || 0)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></article>`).join('')}</div>
  <div style="display:flex;gap:16px;font-size:12px;color:var(--muted2);flex-wrap:wrap"><span>${lvl(5)} 3 or more</span><span>${lvl(2)} 1–2 left</span><span>${lvl(0)} Sold out</span></div>`;
}

/* ----- Categories ----- */
PAGES.categories = () => {
  const sel = S.categories[S.ui.cat] || S.categories[0]; const edit = can('catalog', 'e');
  const count = (c) => S.products.filter((p) => p.cat === c.name || (c.parent === null && S.categories.some((x) => x.parent === c.name && x.name === p.cat))).length;
  return head('Catalog', 'Categories', can('catalog', 'c') ? `<button class="btn primary" data-act="newcat">${ico('plus', 16, 2.2)}New category</button>` : '') +
  `<div class="row"><section class="card col2"><div style="display:flex;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line2);font-size:12px;color:var(--muted)"><span>Shown in this order on the store menu</span><span>Products · On store</span></div>
    ${S.categories.map((c, i) => `<div style="display:flex;align-items:center;gap:10px;padding:0 18px 0 ${c.parent ? 44 : 18}px;height:52px;border-bottom:1px solid var(--line2);background:${i === S.ui.cat ? '#FAFAF6' : '#fff'}">
      ${edit ? `<span style="display:flex;flex-direction:column"><button data-act="catmove" data-v="${i}" data-d="-1" aria-label="Move up" style="border:0;background:none;height:18px;padding:0">${ico('up', 14, 2)}</button><button data-act="catmove" data-v="${i}" data-d="1" aria-label="Move down" style="border:0;background:none;height:18px;padding:0">${ico('down', 14, 2)}</button></span>` : ''}
      <button data-act="cat" data-v="${i}" style="flex:1;text-align:left;background:none;border:0;font-weight:${c.parent ? 400 : 700};color:${c.on ? '#111' : '#8E8E89'}">${c.parent ? '↳ ' : ''}${esc(c.name)}</button><span class="note" style="width:40px;text-align:right">${count(c)}</span>${edit ? sw(c.on, 'caton', `data-v="${i}"`, 'Show ' + c.name) : ''}</div>`).join('')}</section>
  <section class="card pad col1" style="display:flex;flex-direction:column;gap:14px"><h2>Edit "${esc(sel.name)}"</h2>
    <label class="field">Name<input id="cat-name" value="${esc(sel.name)}" ${edit ? '' : 'disabled'}></label>
    <label class="field">Parent category<select id="cat-parent" ${edit ? '' : 'disabled'}><option value="">— None (top level) —</option>${S.categories.filter((c) => !c.parent && c !== sel).map((c) => `<option ${sel.parent === c.name ? 'selected' : ''}>${c.name}</option>`).join('')}</select></label>
    <div class="field">Image <span class="h">(home page category buttons)</span><div class="proof" style="height:110px">Drop image or browse</div></div>
    ${edit ? `<div style="display:flex;gap:8px"><button class="btn primary" data-act="catsave">Save</button><button class="btn danger" data-act="catdel">Delete</button></div><span class="note">A category with products can't be deleted — move its products first.</span>` : ''}</section></div>`;
};

/* ----- Collections ----- */
PAGES.collections = () => {
  const S2 = { Live: ['#1D6B3A', '#fff'], Scheduled: ['#fff', '#111'], Draft: ['#FFF3C4', '#6B4E00'], Ended: ['#5E5E5A', '#fff'] };
  return head('Catalog', 'Collections', can('catalog', 'c') ? `<button class="btn primary" data-act="newcol">${ico('plus', 16, 2.2)}New collection</button>` : '') +
  `<span class="note" style="font-size:13px">Collections group products across categories — drops, seasons, lookbooks. They appear on the home page and in the menu.</span>
  <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px">${S.collections.map((c, i) => { const n = S.products.filter((p) => p.collections.includes(c.name)).length; return `<article class="card"><div style="height:160px;background:#222;position:relative;overflow:hidden">${IMG[c.img] ? `<img src="${IMG[c.img]}" alt="" style="width:100%;height:160px;object-fit:cover;display:block">` : ''}<span style="position:absolute;top:10px;left:10px;background:${S2[c.status][0]};color:${S2[c.status][1]};font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 8px">${c.status.toUpperCase()}</span></div>
    <div style="padding:14px 16px;display:flex;flex-direction:column;gap:6px"><b style="font-family:var(--display);font-weight:900;font-size:16px">${esc(c.name)}</b><span class="note" style="font-size:13px">${n} products · ${esc(c.dates)}</span>
    ${can('catalog', 'e') ? `<div style="display:flex;gap:8px;margin-top:6px">${['Live', 'Draft'].includes(c.status) ? `<button class="btn sm" data-act="colstat" data-v="${i}">${c.status === 'Live' ? 'Unpublish' : 'Publish now'}</button>` : ''}<a href="#products" class="btn sm">Products</a></div>` : ''}</div></article>`; }).join('')}</div>`;
};

/* ----- Reviews ----- */
PAGES.reviews = () => {
  const T = [['pending', 'Waiting'], ['approved', 'Approved'], ['hidden', 'Hidden']]; const list = S.reviews.map((r, i) => ({ ...r, i })).filter((r) => r.status === S.ui.rtab); const edit = can('reviews', 'e');
  return head('Catalog', 'Reviews', '<span class="note">Only customers who bought the product can review it</span>') + tabs(T.map(([id, l]) => [id, l, S.reviews.filter((r) => r.status === id).length]), S.ui.rtab, 'rtab') +
  (list.length ? list.map((r) => { const p = prod(r.pid); return `<article class="card" style="padding:16px 18px;display:flex;gap:16px;flex-wrap:wrap">${thumb(imgOf(p), 64)}<div style="flex:1 1 320px;display:flex;flex-direction:column;gap:6px"><span><b>${p.name}</b> <span class="sub" style="display:inline">${r.variant}</span></span><span role="img" aria-label="${r.rating} out of 5 stars" style="display:flex;gap:2px">${[1, 2, 3, 4, 5].map((n) => star(n <= r.rating)).join('')}</span><p style="margin:0;line-height:1.5">${esc(r.text)}</p><span class="sub">${esc(r.who)} · <span style="color:var(--green);font-weight:500">Verified purchase</span> · ${r.when}</span></div>
    ${edit ? `<div style="display:flex;flex-direction:column;gap:8px;width:140px">${r.status !== 'approved' ? `<button class="btn primary" data-act="revset" data-v="${r.i}" data-i="approved">Approve</button>` : ''}${r.status !== 'hidden' ? `<button class="btn" data-act="revset" data-v="${r.i}" data-i="hidden">Hide</button>` : ''}</div>` : ''}</article>`; }).join('') : '<div class="card empty">Nothing here.</div>');
};

/* ----- Coupons ----- */
PAGES.coupons = () => {
  const edit = can('coupons', 'e'); const pct = S.ui.ctype === 'percent';
  return head('Marketing', 'Coupons') + `<div class="row"><section class="card col3"><div class="scroll"><table class="tbl"><thead><tr><th>Code</th><th>Discount</th><th>Min. spend</th><th>Used</th><th>Valid</th><th>Active</th></tr></thead><tbody>
    ${S.coupons.map((c, i) => `<tr><td><span class="mono" style="font-weight:700;background:var(--soft);padding:4px 8px;border:1px dashed #8E8E89">${esc(c.code)}</span></td><td style="font-weight:500">${c.type === 'percent' ? c.value + '%' + (c.max ? ' (max ' + num(c.max) + ')' : '') : money(c.value) + ' off'}</td><td>${money(c.min)}</td>
      <td><div style="display:flex;flex-direction:column;gap:4px">${c.used} / ${c.limit}<span class="bar" style="width:90px"><span style="width:${Math.round(c.used / c.limit * 90)}px;background:#111"></span></span></div></td><td>${esc(c.valid)}</td><td>${edit ? sw(c.on, 'cpon', `data-v="${i}"`, 'Activate ' + c.code) : (c.on ? 'Yes' : 'No')}</td></tr>`).join('')}</tbody></table></div></section>
  ${can('coupons', 'c') ? `<aside class="card pad col1" style="display:flex;flex-direction:column;gap:12px"><h2>Create coupon</h2><label class="field">Code<div style="display:flex;gap:6px"><input id="cp-code" value="RGN10" style="flex:1;min-width:0;text-transform:uppercase" class="mono"><button class="btn" data-act="cpgen">Generate</button></div></label>
    ${seg([['percent', 'Percentage %'], ['fixed', 'Fixed amount']], S.ui.ctype, 'ctype', 'style="display:grid;grid-template-columns:1fr 1fr"')}
    <div class="fgrid" style="grid-template-columns:1fr 1fr"><label class="field">${pct ? 'Discount %' : 'Discount (MMK)'}<input id="cp-val" value="${pct ? 10 : 5000}"></label><label class="field">Min. spend<input id="cp-min" value="50000"></label>${pct ? '<label class="field">Max. discount<input id="cp-max" value="10000"></label>' : ''}<label class="field">Total uses<input id="cp-lim" value="100"></label></div>
    <div class="box"><b>Customers will see:</b><br>${pct ? '10% off orders over 50,000 MMK (up to 10,000 MMK). One use per customer.' : '5,000 MMK off orders over 50,000 MMK. One use per customer.'}</div><button class="btn primary lg" data-act="cpcreate">Create coupon</button></aside>` : ''}</div>`;
};

/* ----- Banners ----- */
PAGES.banners = () => {
  const edit = can('banners', 'e');
  return head('Marketing', 'Banners', can('banners', 'c') ? `<button class="btn primary" data-act="toast" data-v="Upload form would open here (demo)">${ico('plus', 16, 2.2)}New banner</button>` : '') +
  [['hero', 'Home — Hero (top of page)', 'Active banners rotate every 5 seconds'], ['mid', 'Home — Middle tiles', 'Shown under "Now Featuring"']].map(([pos, t, h]) => `<section class="card"><div class="pad" style="display:flex;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line2)"><h2>${t}</h2><span class="note">${h}</span></div>
    ${S.banners.map((b, i) => ({ ...b, i })).filter((b) => b.pos === pos).map((b) => `<div class="list-row" style="padding:12px 18px;flex-wrap:wrap">${edit ? `<span style="display:flex;flex-direction:column"><button data-act="banmove" data-v="${b.i}" data-d="-1" aria-label="Move up" style="border:0;background:none;height:18px;padding:0">${ico('up', 14, 2)}</button><button data-act="banmove" data-v="${b.i}" data-d="1" aria-label="Move down" style="border:0;background:none;height:18px;padding:0">${ico('down', 14, 2)}</button></span>` : ''}
      <img src="${IMG[b.img] || ''}" alt="Desktop" style="width:200px;height:90px;object-fit:cover;background:#222"><img src="${IMG[b.img] || ''}" alt="Mobile" style="width:48px;height:90px;object-fit:cover;background:#222">
      <div style="flex:1 1 200px;display:flex;flex-direction:column;gap:4px"><b>${esc(b.title)}</b><span class="note" style="font-size:13px">Links to: ${esc(b.link)}</span><span style="font-size:12px;color:${b.on ? 'var(--green)' : 'var(--muted)'}">${b.on ? esc(b.when) : 'Hidden'}</span></div>${edit ? sw(b.on, 'banon', `data-v="${b.i}"`, 'Show ' + b.title) : ''}</div>`).join('')}</section>`).join('');
};

/* ----- Delivery ----- */
PAGES.delivery = () => {
  const edit = can('delivery', 'e');
  return head('Settings', 'Delivery zones', edit ? `<button class="btn primary" data-act="newzone">${ico('plus', 16, 2.2)}Add zone</button>` : '') +
  `<div class="row"><section class="card col3"><div class="scroll"><table class="tbl"><thead><tr><th>City</th><th>Township</th><th>Fee (MMK)</th><th>Delivery time</th><th>Active</th></tr></thead><tbody>
    ${S.zones.map((z, i) => `<tr><td><b>${i && S.zones[i - 1].city === z.city ? '' : esc(z.city)}</b></td><td>${esc(z.town)}</td><td><input data-in="zfee" data-v="${i}" value="${num(z.fee)}" style="width:110px;height:34px" ${edit ? '' : 'disabled'} aria-label="Fee for ${esc(z.town)}"></td><td>${esc(z.days)}</td><td>${edit ? sw(z.on, 'zon', `data-v="${i}"`, 'Deliver to ' + z.town) : (z.on ? 'Yes' : 'No')}</td></tr>`).join('')}</tbody></table></div></section>
  <aside class="col1" style="display:flex;flex-direction:column;gap:16px"><section class="card pad" style="display:flex;flex-direction:column;gap:10px"><h2>Free delivery</h2><label class="field">Free when the order is over (MMK)<input data-in="freeship" value="${num(S.freeShip)}" ${edit ? '' : 'disabled'}></label><span class="note">Shown in the cart as "Add X more for free delivery".</span></section>
    <section class="card pad note" style="font-size:13px"><h2 style="color:#111;margin-bottom:6px">How it works</h2>At checkout the customer picks city then township. The fee comes from the township first, then "All other townships" for that city. New order uses the same fees.</section></aside></div>`;
};

/* ----- Settings ----- */
PAGES.settings = () => {
  const edit = can('settings', 'e'); const dis = edit ? '' : 'disabled';
  return head('Settings', 'Settings', edit ? `<button class="btn primary" data-act="toast" data-v="Settings saved">Save changes</button>` : '') +
  `<section class="card pad" style="display:flex;flex-direction:column;gap:14px"><h2>Store info</h2><div class="fgrid">
    <label class="field">Store name<input data-in="store.name" value="${esc(S.store.name)}" ${dis}></label><label class="field">Contact email<input data-in="store.email" value="${esc(S.store.email)}" ${dis}></label>
    <label class="field">Phone (shown on site)<input data-in="store.phone" value="${esc(S.store.phone)}" ${dis}></label><label class="field">Facebook page<input placeholder="facebook.com/…" ${dis}></label>
    <label class="field">Instagram<input placeholder="@rangoonclub" ${dis}></label><label class="field">TikTok<input placeholder="@rangoonclub" ${dis}></label></div>

/* ================= ACTIONS ================= */
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), 2800); }
function modal(html) { $('#modal').innerHTML = `<div class="modal-bg" data-act="mclose"><div class="modal" role="dialog" aria-modal="true" onclick="event.stopPropagation()">${html}</div></div>`; const f = $('#modal input, #modal select, #modal button'); f && f.focus(); }
const closeModal = () => { $('#modal').innerHTML = ''; };
const order = (no) => S.orders.find((o) => o.no === no);
const hist = (o, text, c) => o.hist.push({ t: NOW + (o.hist.length + 1) * MIN, who: me().name, text, c });
const ACT = {
  reset() { S = seed(); S.orders.forEach((o) => o.items.forEach((i) => { i.price = priceOf(prod(i.pid)); })); location.hash = '#dashboard'; render(); toast('Demo data reset'); },

  role(d) { S.role = d.v; S.ui.osel = {}; S.ui.draft = null; toast('Now viewing as ' + me().name + ' (' + me().role + ')'); if (!allowed(curRoute().name)) location.hash = '#dashboard'; else render(); },
  toast(d) { toast(d.v); }, mclose: closeModal,
  range(d) { S.ui.range = d.v; render(); }, otab(d) { S.ui.otab = d.v; S.ui.osel = {}; render(); },
  osel(d, e) { e.stopPropagation(); S.ui.osel[d.v] = !S.ui.osel[d.v]; render(); },
  oselall() { const vis = visibleOrders(); const any = vis.every((o) => S.ui.osel[o.no]); S.ui.osel = {}; if (!any) vis.forEach((o) => { if (S.ui.otab === 'all' || o.status === S.ui.otab) S.ui.osel[o.no] = true; }); render(); },
  oselclear() { S.ui.osel = {}; render(); },
  bulk(d) { let n = 0; Object.keys(S.ui.osel).forEach((no) => { const o = order(no); if (o && S.ui.osel[no] && o.status !== 'Cancelled' && o.pay !== 'verify') { o.status = d.v; hist(o, 'Status changed to ' + d.v, ST_COLOR[d.v]); n++; } }); S.ui.osel = {}; render(); toast(n + ' orders marked as ' + d.v + (n ? '' : ' (orders waiting for payment check are skipped)')); },
  advance(d) { const o = order(d.v); const i = STATUSES.indexOf(o.status); if (i < 4) { o.status = STATUSES[i + 1]; hist(o, 'Status changed to ' + o.status, ST_COLOR[o.status]); render(); toast(o.no + ' → ' + o.status + ' · customer emailed'); } },
  verify(d) { const o = order(d.v); o.tx = ($('#tx-in') || {}).value || ''; o.pay = 'paid'; hist(o, 'Payment verified' + (o.tx ? ' · Tx ' + o.tx : ''), '#1D6B3A'); if (o.status === 'Pending') { o.status = 'Confirmed'; hist(o, 'Status changed to Confirmed', ST_COLOR.Confirmed); } render(); toast('Payment verified · customer emailed'); },
  reject(d) { modal(`<h2 style="font-size:17px">Reject payment for ${d.v}?</h2><label class="field">Reason (emailed to the customer)<select id="rej-r"><option>Amount does not match</option><option>Screenshot is unclear</option><option>Payment not received in our account</option></select></label><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="mclose">Back</button><button class="btn danger" data-act="rejectok" data-v="${d.v}">Reject payment</button></div>`); },
  rejectok(d) { const o = order(d.v); const r = $('#rej-r').value; o.pay = 'rejected'; hist(o, 'Payment rejected — ' + r, '#B0122A'); closeModal(); render(); toast('Customer asked to upload again'); },
  unreject(d) { const o = order(d.v); o.pay = 'verify'; hist(o, 'New screenshot uploaded', '#F5B841'); render(); },
  markpaid(d) { const o = order(d.v); o.pay = 'paid'; hist(o, 'Marked as fully paid', '#1D6B3A'); render(); toast('Marked as paid'); },
  note(d) { const v = $('#note-in').value.trim(); if (!v) return toast('Write a note first'); order(d.v).notes.push({ text: v, who: me().name, t: NOW + 5 * MIN }); render(); toast('Note added'); },
  cancel(d) { modal(`<h2 style="font-size:17px">Cancel ${d.v}?</h2><p class="note" style="font-size:14px;margin:0">The items go back into stock and the customer is emailed. Paid orders are marked for refund.</p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="mclose">Keep order</button><button class="btn danger" data-act="cancelok" data-v="${d.v}">Cancel order</button></div>`); },
  cancelok(d) { const o = order(d.v); o.items.forEach((i) => { const p = prod(i.pid); p.stock[i.color + '|' + i.size] += i.qty; S.moves.unshift({ t: NOW + MIN, what: p.name + ' ' + i.color + ' / ' + i.size, why: 'Cancelled · ' + o.no, d: i.qty, who: me().name }); }); if (o.pay === 'paid') o.pay = 'refunded'; o.status = 'Cancelled'; hist(o, 'Order cancelled · stock returned', '#B0122A'); closeModal(); render(); toast('Order cancelled · stock returned'); },
  /* new order */

  addcolor(d) { modal(`<h2 style="font-size:17px">Add a color</h2><label class="field">Color name<input id="nc-name" placeholder="e.g. Olive"></label><label class="field">Swatch<input id="nc-hex" type="color" value="#6B7A4B" style="height:44px;padding:2px"></label><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="mclose">Cancel</button><button class="btn primary" data-act="addcolorok" data-v="${d.v}">Add color</button></div>`); },

    S.coupons.unshift({ code, type: S.ui.ctype, value: n('#cp-val'), max: pct ? n('#cp-max') : 0, min: n('#cp-min'), used: 0, limit: n('#cp-lim') || 100, valid: 'From today', on: true }); render(); toast(code + ' created'); },
  banon(d) { const b = S.banners[d.v]; b.on = !b.on; render(); },
  banmove(d) { const i = +d.v, j = i + +d.d; if (!S.banners[j] || S.banners[j].pos !== S.banners[i].pos) return; [S.banners[i], S.banners[j]] = [S.banners[j], S.banners[i]]; render(); },
  zon(d) { const z = S.zones[d.v]; z.on = !z.on; render(); },
  newzone() { modal(`<h2 style="font-size:17px">Add delivery zone</h2><div class="fgrid"><label class="field">City<input id="nz-c" placeholder="e.g. Bago"></label><label class="field">Township<input id="nz-t" placeholder="All townships"></label><label class="field">Fee (MMK)<input id="nz-f" value="4500"></label><label class="field">Delivery time<input id="nz-d" value="3–5 days"></label></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="mclose">Cancel</button><button class="btn primary" data-act="newzoneok">Add zone</button></div>`); },
  newzoneok() { const c = $('#nz-c').value.trim(); if (!c) return toast('Type a city'); S.zones.push({ city: c, town: $('#nz-t').value.trim() || 'All townships', fee: +$('#nz-f').value.replace(/,/g, '') || 0, days: $('#nz-d').value, on: true }); closeModal(); render(); toast('Zone added — it now shows at checkout and in New order'); },
  payon(d) { S.pays[d.v].on = !S.pays[d.v].on; render(); }, chon(d) { S.channels[d.v].on = !S.channels[d.v].on; render(); }, tg() { S.telegram = !S.telegram; render(); },
  newch() { modal(`<h2 style="font-size:17px">Add sales channel</h2><label class="field">Name<input id="nch" placeholder="e.g. TikTok Shop"></label><label class="field">Type<select id="ncht"><option>Social</option><option>Marketplace</option><option>Offline</option><option>Direct</option></select></label><label class="field">Color<input id="nchc" type="color" value="#0F6B78" style="height:44px;padding:2px"></label><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="mclose">Cancel</button><button class="btn primary" data-act="newchok">Add</button></div>`); },
  newchok() { const n = $('#nch').value.trim(); if (!n) return toast('Type a name'); S.channels.push({ name: n, color: $('#nchc').value, type: $('#ncht').value, comm: '—', on: true }); closeModal(); render(); toast(n + ' added — staff can pick it in New order'); },
  /* staff & roles */
  invite() { const n = $('#inv-name').value.trim(), e = $('#inv-email').value.trim(); if (!n || !e.includes('@')) return toast('Add a name and a valid email'); S.staff.push({ name: n, email: e, role: $('#inv-role').value, last: '—', status: 'Invite pending' }); render(); toast('Invite sent to ' + e); },
  rolepick(d) { S.ui.role = d.v; render(); },
  perm(d) { const P = S.perms[S.ui.role]; let cur = P[d.v] || ''; const avail = AREAS.find((a) => a[0] === d.v)[3];
    if (cur.includes(d.i)) { cur = cur.replace(d.i, ''); if (d.i === 'v') cur = ''; } else { cur += d.i; if (d.i !== 'v' && avail.includes('v') && !cur.includes('v')) cur += 'v'; }
    P[d.v] = cur; render(); toast(S.ui.role + ' permissions updated'); },
  ownonly() { S.ownOnly[S.ui.role] = !S.ownOnly[S.ui.role]; render(); }
};
const INPUT = {
  oq(el) { S.ui.oq = el.value; renderKeep(el); }, och(el) { S.ui.och = el.value; render(); }, sq(el) { S.ui.sq = el.value; renderKeep(el); },
  'd.ref'(el) { draft().ref = el.value; }, 'd.name'(el) { draft().name = el.value; renderKeep(el); }, 'd.email'(el) { draft().email = el.value; }, 'd.phone'(el) { draft().phone = el.value; }, 'd.addr'(el) { draft().addr = el.value; },
  'd.disc'(el) { draft().disc = +el.value.replace(/[^0-9]/g, '') || 0; renderKeep(el); }, 'd.method'(el) { draft().method = el.value; }, dzone(el) { draft().zone = +el.value; render(); },
  dcolor(el) { const l = draft().lines[el.dataset.i]; const p = prod(l.pid); l.color = el.value; l.size = p.sizes.find((s) => p.stock[l.color + '|' + s] > 0) || ''; l.qty = 1; render(); },
  'p.name'(el) { prod(el.dataset.v).name = el.value; }, 'p.short'(el) { prod(el.dataset.v).short = el.value; }, 'p.details'(el) { prod(el.dataset.v).details = el.value; }, 'p.care'(el) { prod(el.dataset.v).care = el.value; },
  'p.price'(el) { prod(el.dataset.v).price = +el.value.replace(/[^0-9]/g, '') || 0; }, 'p.sale'(el) { prod(el.dataset.v).sale = +el.value.replace(/[^0-9]/g, '') || 0; }, 'p.cat'(el) { prod(el.dataset.v).cat = el.value; },
  photo(el) { const f = el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { prod(el.dataset.v).colors[el.dataset.i].upload = r.result; render(); toast('Photo uploaded (demo — stays until reload)'); }; r.readAsDataURL(f); },
  zfee(el) { S.zones[el.dataset.v].fee = +el.value.replace(/[^0-9]/g, '') || 0; }, freeship(el) { S.freeShip = +el.value.replace(/[^0-9]/g, '') || 0; },
  'store.name'(el) { S.store.name = el.value; }, 'store.email'(el) { S.store.email = el.value; }, 'store.phone'(el) { S.store.phone = el.value; },
  staffrole(el) { const s = S.staff[el.dataset.v]; s.role = el.value; render(); toast(s.name + ' is now ' + el.value); }
};
const LIVE = new Set(['oq', 'sq', 'd.name', 'd.disc']);
function renderKeep(el) { const key = el.dataset.in, pos = el.selectionStart; render(); const n = document.querySelector(`[data-in="${key}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) { /* not a text input */ } } }

/* ================= ROUTER ================= */
function curRoute() { const h = (location.hash || '#dashboard').slice(1); if (h.startsWith('order-')) return { name: 'order', arg: h.slice(6), area: 'orders' }; if (h.startsWith('product-')) return { name: 'product', arg: h.slice(8), area: 'products' }; return { name: PAGES[h] ? h : 'dashboard', arg: null, area: (ROUTES[h] || {}).area }; }
function render() {
  const r = curRoute();
  renderChrome(r.name);
  let html;
  if (r.name === 'order' ? !can('orders') : r.name === 'product' ? !can('products') : !allowed(r.name)) html = noAccess(r.name === 'order' ? 'orders' : r.name === 'product' ? 'products' : (ROUTES[r.name] || {}).label || r.name);
  else html = PAGES[r.name](r.arg);
  $('#view').innerHTML = html;
}
window.addEventListener('hashchange', () => { $('#app').classList.remove('open'); render(); window.scrollTo(0, 0); });
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-act]');
  if (a) { const fn = ACT[a.dataset.act]; if (fn) { if (a.tagName !== 'INPUT') e.preventDefault(); fn(a.dataset, e); } return; }
  const g = e.target.closest('[data-go]'); if (g && !e.target.closest('a,button,input,select')) location.hash = '#' + g.dataset.go;
  if ($('#app').classList.contains('open') && !e.target.closest('#side') && !e.target.closest('[data-act="menu"]')) $('#app').classList.remove('open');
});
document.addEventListener('input', (e) => { const k = e.target.dataset && e.target.dataset.in; if (k && INPUT[k] && e.target.tagName !== 'SELECT' && e.target.type !== 'file') INPUT[k](e.target); });
document.addEventListener('change', (e) => { const k = e.target.dataset && e.target.dataset.in; if (k && INPUT[k] && (e.target.tagName === 'SELECT' || e.target.type === 'file')) INPUT[k](e.target); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeModal(); $('#app').classList.remove('open'); } if (e.key === 'Enter' && e.target.id === 'gsearch') { S.ui.oq = e.target.value; S.ui.otab = 'all'; location.hash = '#orders'; render(); } });
render();

</script>
