<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prize Wheel</title>
<style>
  /* ---------- Design tokens ---------- */
  :root{
    --ink:        #1f2a24;   /* near-black green-black, main text */
    --cream:      #f4ecd8;   /* ticket-stock background */
    --teal:       #1f6f6b;   /* carnival teal */
    --teal-dark:  #124b48;
    --mustard:    #e0a526;   /* marquee gold */
    --coral:      #d1503a;   /* accent / winner pop */
    --line:       #1f2a24;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 50% 0%, #fffdf6 0%, var(--cream) 55%);
    font-family: 'Futura', 'Trebuchet MS', 'Segoe UI', sans-serif;
    color: var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 40px 16px 80px;
  }

  /* Marquee-style heading, bulb border made of radial-gradient dots */
  .marquee{
    position:relative;
    padding: 14px 40px;
    background: var(--teal-dark);
    border-radius: 14px;
    box-shadow: 0 6px 0 var(--ink);
  }
  .marquee h1{
    margin:0;
    font-size: clamp(28px, 5vw, 44px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--mustard);
    text-shadow: 0 2px 0 rgba(0,0,0,.35);
  }
  .marquee::before, .marquee::after{
    content:"";
    position:absolute;
    top:0; bottom:0;
    width: 100%;
    left:0;
    background-image: radial-gradient(circle, var(--mustard) 3px, transparent 3.5px);
    background-size: 22px 100%;
    background-repeat: repeat-x;
    background-position: center top, center bottom;
    pointer-events:none;
    opacity:.9;
  }
  .marquee::before{ background-position: 6px 6px; }
  .marquee::after{ background-position: 6px calc(100% - 6px); }

  .subtitle{
    margin: 18px 0 36px;
    font-size: 15px;
    letter-spacing: 1px;
    color: var(--ink);
    opacity:.75;
    text-align:center;
    max-width: 420px;
  }

  /* ---------- Wheel assembly ---------- */
  .wheel-stage{
    position: relative;
    width: min(420px, 86vw);
    aspect-ratio: 1 / 1;
    margin-bottom: 34px;
  }

  /* Pointer sits fixed at the top, wheel spins underneath it */
  .pointer{
    position:absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    width: 0; height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 32px solid var(--coral);
    filter: drop-shadow(0 3px 0 var(--ink));
    z-index: 5;
  }

  canvas#wheel{
    display:block;
    width:100%;
    height:100%;
    border-radius: 50%;
    border: 6px solid var(--ink);
    box-shadow:
      0 0 0 10px var(--cream),
      0 0 0 16px var(--teal-dark),
      0 18px 30px -14px rgba(0,0,0,.45);
    /* the rotation itself is animated via inline style + CSS transition, set in JS */
  }

  /* Hub button in the center of the wheel */
  .hub{
    position:absolute;
    top:50%; left:50%;
    width: 78px; height:78px;
    transform: translate(-50%,-50%);
    border-radius:50%;
    background: var(--coral);
    border: 4px solid var(--ink);
    color: var(--cream);
    font-weight:bold;
    font-size:14px;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    z-index: 6;
    box-shadow: 0 4px 0 #8f3423;
    transition: transform .08s ease;
  }
  .hub:active{ transform: translate(-50%,-50%) translateY(3px); box-shadow: 0 1px 0 #8f3423; }
  .hub:disabled{ opacity:.6; cursor:not-allowed; }

  /* ---------- Winner panel ---------- */
  .winner-panel{
    width: min(420px, 86vw);
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 16px;
    padding: 22px 24px;
    text-align:center;
    box-shadow: 0 6px 0 var(--ink);
  }
  .winner-label{
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color: var(--teal);
    font-weight:bold;
    margin-bottom:8px;
  }
  .winner-name{
    font-size: 26px;
    font-weight:bold;
    min-height: 34px;
    color: var(--ink);
  }
  .winner-name.placeholder{ opacity:.35; font-weight:normal; font-size:16px; }
  .winner-odds{
    margin-top:6px;
    font-size:13px;
    color: var(--ink);
    opacity:.6;
  }

  /* Simple legend showing every prize and its probability, for transparency */
  .legend{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 18px;
    margin-top: 30px;
    width: min(420px, 86vw);
    font-size: 13px;
  }
  .legend-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .swatch{
    width:12px; height:12px;
    border-radius:3px;
    border:1.5px solid var(--ink);
    flex-shrink:0;
  }
</style>
</head>
<body>

  <div class="marquee"><h1>Prize Wheel</h1></div>
  <p class="subtitle">Remembering YUECO</p>

  <div class="wheel-stage">
    <div class="pointer" aria-hidden="true"></div>
    <canvas id="wheel" width="600" height="600"></canvas>
    <button id="spinBtn" class="hub">Spin</button>
  </div>

  <div class="winner-panel">
    <div class="winner-label">Winner</div>
    <div id="winnerName" class="winner-name placeholder">— spin to find out —</div>
    <div id="winnerOdds" class="winner-odds"></div>
  </div>

  <div id="legend" class="legend"></div>

<script>
/* =========================================================================
   PRIZE CONFIGURATION
   ---------------------------------------------------------------------
   Each prize has a "weight" that represents its ACTUAL percentage
   probability of being chosen. All weights below MUST add up to 100
   (the code checks this on load).

   IMPORTANT — visual size vs. real odds:
   This wheel is drawn with EQUAL-SIZED slices (same layout every time,
   like a normal-looking wheel) regardless of weight. The actual chance
   of winning each prize is controlled ENTIRELY by the "weight" value
   below, not by how big the slice looks. See SLICES_ARE_EQUAL_SIZE
   further down if you ever want to switch back to size-matches-odds.
   ========================================================================= */
const PRIZES = [
  { name: "T-Shirt",  weight: 0.05, color: "#1f6f6b" }, // teal
  { name: "Necklace", weight: 0.95, color: "#e0a526" }, // mustard
  { name: "Cola",     weight: 25,   color: "#d1503a" }, // coral
  { name: "Sticker",  weight: 59,   color: "#f4ecd8" }, // cream
  { name: "Respin",   weight: 15,   color: "#124b48" }, // dark teal
];

// Set to false so slices are drawn equal-sized (visual "fair" wheel) even
// though the real odds above are not equal. Set to true to make slice
// size match the weight instead (like a traditional weighted wheel).
const SLICES_ARE_EQUAL_SIZE = true;

// Sanity check: warn in console if the weights don't sum to 100%.
(function validateWeights(){
  const total = PRIZES.reduce((sum, p) => sum + p.weight, 0);
  if (Math.abs(total - 100) > 0.001) {
    console.warn(`PRIZES weights sum to ${total}, expected 100.`);
  }
})();

/* =========================================================================
   DRAW THE WHEEL
   ---------------------------------------------------------------------
   Each slice's ANGLE is proportional to its WEIGHT, so the visual size
   of a slice always matches its real probability (a 30% prize takes up
   30% of the circle, etc). We also store each slice's start/end angle
   so we can later calculate exactly which slice the pointer lands on.
   ========================================================================= */
const canvas = document.getElementById('wheel');
const ctx = canvas.getContext('2d');
const size = canvas.width;           // 600 x 600 internal resolution
const center = size / 2;
const radius = size / 2 - 6;

// Precompute each slice's angular start/end (in radians).
// If SLICES_ARE_EQUAL_SIZE is true, every slice gets the same angular
// width (360 / number of prizes) regardless of its actual win weight.
// Otherwise, slice width is proportional to weight (visual = real odds).
let sliceAngles = [];
function computeSliceAngles(){
  sliceAngles = [];
  let startAngle = 0;
  const equalSlice = (2 * Math.PI) / PRIZES.length;

  for (const prize of PRIZES) {
    const sliceRadians = SLICES_ARE_EQUAL_SIZE
      ? equalSlice
      : (prize.weight / 100) * 2 * Math.PI;

    sliceAngles.push({
      prize,
      start: startAngle,
      end: startAngle + sliceRadians
    });
    startAngle += sliceRadians;
  }
}

function drawWheel(){
  ctx.clearRect(0, 0, size, size);

  sliceAngles.forEach(({ prize, start, end }) => {
    // --- slice wedge ---
    ctx.beginPath();
    ctx.moveTo(center, center);
    ctx.arc(center, center, radius, start, end);
    ctx.closePath();
    ctx.fillStyle = prize.color;
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#1f2a24";
    ctx.stroke();

    // --- slice label, drawn along the middle angle of the slice ---
    const mid = (start + end) / 2;
    ctx.save();
    ctx.translate(center, center);
    ctx.rotate(mid);
    ctx.textAlign = "right";
    ctx.textBaseline = "middle";
    // pick readable text color depending on slice background
    ctx.fillStyle = (prize.color === "#f4ecd8") ? "#1f2a24" : "#f4ecd8";
    ctx.font = "bold 22px 'Trebuchet MS', sans-serif";
    ctx.fillText(prize.name, radius - 18, 0);
    ctx.restore();
  });
}

computeSliceAngles();
drawWheel();

/* =========================================================================
   BUILD THE LEGEND (list of prizes + odds + color swatch)
   ========================================================================= */
const legendEl = document.getElementById('legend');
PRIZES.forEach(p => {
  const row = document.createElement('div');
  row.className = 'legend-row';
  row.innerHTML = `
    <span class="swatch" style="background:${p.color}"></span>
    <span>${p.name}</span>
  `;
  legendEl.appendChild(row);
});

/* =========================================================================
   WEIGHTED RANDOM SELECTION
   ---------------------------------------------------------------------
   This is the core "percentage probability" logic. We pick a random
   number between 0 and 100, then walk through the prize list adding up
   weights until we find the prize whose cumulative range contains that
   number. This guarantees each prize is chosen at exactly its intended
   percentage, over many spins.
   ========================================================================= */
function pickWeightedPrize(){
  const roll = Math.random() * 100;   // random number in [0, 100)
  let cumulative = 0;
  for (const prize of PRIZES) {
    cumulative += prize.weight;
    if (roll < cumulative) {
      return prize;
    }
  }
  // Fallback in case of floating point rounding — return the last prize.
  return PRIZES[PRIZES.length - 1];
}

/* =========================================================================
   SPIN ANIMATION
   ---------------------------------------------------------------------
   1. Use pickWeightedPrize() to decide the winner FIRST (so the visuals
      and the actual result can never disagree).
   2. Find that prize's slice angle range on the wheel.
   3. Calculate a final rotation that lands the pointer (fixed at the top,
      i.e. angle = -90deg / -PI/2) inside that slice, plus several extra
      full rotations for a satisfying spin effect.
   4. Animate via CSS transition on canvas "transform: rotate()".
   5. When the animation ends, display the winner (same item that the
      wheel visually landed on) in the winner panel below.
   ========================================================================= */
const spinBtn = document.getElementById('spinBtn');
const winnerNameEl = document.getElementById('winnerName');
const winnerOddsEl = document.getElementById('winnerOdds');

let currentRotation = 0;   // tracks total rotation applied so far, in degrees

function spin(){
  spinBtn.disabled = true;
  winnerNameEl.textContent = "…spinning…";
  winnerNameEl.classList.add('placeholder');
  winnerOddsEl.textContent = "";

  // Step 1: decide the winning prize using the weighted probabilities.
  const winningPrize = pickWeightedPrize();
  const winningSlice = sliceAngles.find(s => s.prize === winningPrize);

  // Step 2: pick a random target point WITHIN that slice (not always dead
  // center) so repeat spins on the same prize don't look identical.
  const margin = 0.05; // stay a little away from the slice edges
  const sliceSpan = winningSlice.end - winningSlice.start;
  const targetAngleInSlice =
    winningSlice.start + sliceSpan * (margin + Math.random() * (1 - 2 * margin));

  // Convert target angle (radians, measured from 0 = 3 o'clock, clockwise)
  // into the degrees the wheel must rotate so that this point ends up
  // under the fixed pointer at the top of the wheel (which is -90deg).
  const targetDegrees = targetAngleInSlice * (180 / Math.PI);
  const pointerDegrees = -90; // pointer position on an unrotated wheel

  // The rotation needed so that (targetDegrees + rotation) lands at pointerDegrees,
  // normalized into 0–360, then padded with extra full spins for effect.
  const extraSpins = 6; // full rotations, purely visual flourish
  let deltaToPointer = (pointerDegrees - targetDegrees) - (currentRotation % 360);
  deltaToPointer = ((deltaToPointer % 360) + 360) % 360; // normalize to [0, 360)

  const finalRotation = currentRotation + extraSpins * 360 + deltaToPointer;

  // Step 3: animate the wheel to the calculated final rotation.
  canvas.style.transition = "transform 4.2s cubic-bezier(0.15, 0.65, 0.15, 1)";
  canvas.style.transform = `rotate(${finalRotation}deg)`;
  currentRotation = finalRotation;

  // Step 4: once the CSS transition finishes, reveal the winner.
  // We use a one-time 'transitionend' listener tied to the transform property.
  function onSpinEnd(e){
    if (e.propertyName !== 'transform') return;
    canvas.removeEventListener('transitionend', onSpinEnd);

    // This is the SAME prize object chosen in Step 1 — guaranteeing the
    // winner panel always matches exactly where the wheel visually landed.
    winnerNameEl.textContent = `🎉 ${winningPrize.name}!`;
    winnerNameEl.classList.remove('placeholder');

    spinBtn.disabled = false;
  }
  canvas.addEventListener('transitionend', onSpinEnd);
}

spinBtn.addEventListener('click', spin);
</script>
</body>
</html>
